<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>آب‌وهوا پرو | WeatherPro</title>
  <meta name="description" content="سایت آب‌وهوای دو زبانه با پیش‌بینی فعلی، ساعتی و ۵ روزه، جستجوی شهر و حالت شب و روز — Bilingual weather site with current, hourly & 5-day forecast, city search, dark & light mode. Built by Yousef." />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef6f4" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c1618" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='9' cy='9' r='5' fill='%23f5b242'/%3E%3Cpath d='M17.5 20H10a5.5 5.5 0 1 1 1.7-10.73A6 6 0 0 1 23 12.5 5.5 5.5 0 0 1 17.5 20Z' fill='%232da296'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    /* Apply theme BEFORE first paint (no flash) */
    (function () {
      try {
        var t = localStorage.getItem("wp_theme") || "system";
        var d = t === "dark" || (t === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = d ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
</head>
<body data-cond="clear">

  <!-- dynamic ambient background -->
  <div class="ambient" aria-hidden="true">
    <div class="ambient-overlay" id="ambientOverlay"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="rain-fx" id="rainFx"></div>
    <div class="stars-fx" id="starsFx">
      <span class="star" style="top:8%;left:12%;animation-delay:0s"></span>
      <span class="star" style="top:14%;left:78%;animation-delay:.6s"></span>
      <span class="star" style="top:22%;left:35%;animation-delay:1.2s"></span>
      <span class="star" style="top:6%;left:55%;animation-delay:1.8s"></span>
      <span class="star" style="top:18%;left:90%;animation-delay:.3s"></span>
      <span class="star" style="top:10%;left:26%;animation-delay:2.2s"></span>
      <span class="star" style="top:26%;left:64%;animation-delay:1.5s"></span>
      <span class="star" style="top:20%;left:6%;animation-delay:2.6s"></span>
    </div>
  </div>

  <!-- header -->
  <header class="site-header glass">
    <div class="wrap header-in">
      <div class="brand">
        <span class="brand-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="9" r="4"/><path d="M9 1.5V3M3.4 3.4l1 1M1.5 9H3M3.4 14.6l1-1"/>
            <path d="M17.5 20H10a5.5 5.5 0 1 1 1.7-10.73A6 6 0 0 1 23 12.5 5.5 5.5 0 0 1 17.5 20Z"/>
          </svg>
        </span>
        <div class="brand-txt">
          <p class="brand-name" data-i18n="appName">آب‌وهوا پرو</p>
          <p class="brand-tag" data-i18n="appTagline">پیش‌بینی دقیق، همه‌جا، همیشه</p>
        </div>
      </div>
      <div class="header-btns">
        <button type="button" id="langBtn" class="btn btn-outline btn-pill" data-i18n-aria="switchTo" aria-label="English">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg>
          <span data-i18n="switchTo">English</span>
        </button>
        <button type="button" id="themeBtn" class="btn btn-outline btn-icon" data-i18n-aria="themeToggle" title="تغییر حالت شب و روز" aria-label="تغییر حالت شب و روز">
          <svg class="ic theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <svg class="ic theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <button type="button" id="keyBtn" class="btn btn-outline btn-icon" data-i18n-aria="settings" title="API Key" aria-label="API Key">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap main">
    <!-- search -->
    <section class="search-area" aria-label="search">
      <form id="searchForm" class="search-form" role="search" autocomplete="off">
        <div class="search-box">
          <svg class="ic search-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="searchInput" type="text" inputmode="search" data-i18n-ph="searchPlaceholder"
                 placeholder="نام شهر، روستا یا منطقه… مثلاً: تهران" aria-label="search city" />
          <svg class="ic search-spin" id="searchSpin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" hidden aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          <button type="button" id="clearBtn" class="clear-btn" aria-label="clear" hidden>
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <button type="button" id="locateBtn" class="btn btn-outline btn-locate" data-i18n-aria="myLocation" title="موقعیت من" aria-label="موقعیت من">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </form>

      <!-- suggestions dropdown (city disambiguation) -->
      <div id="suggest" class="suggest glass" role="listbox" hidden></div>

      <!-- recent searches -->
      <div id="recentRow" class="recent" hidden>
        <span class="recent-label">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span data-i18n="recentSearches">جستجوهای اخیر</span>:
        </span>
        <span id="recentChips" class="recent-chips"></span>
        <button type="button" id="clearRecent" class="link-btn" data-i18n="clearRecent">پاک کردن</button>
      </div>
    </section>

    <!-- message / error bar -->
    <div id="msgBar" class="msg glass" role="alert" hidden>
      <svg class="ic msg-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg>
      <p id="msgText" class="msg-txt"></p>
      <button type="button" id="msgRetry" class="btn btn-primary btn-pill" data-i18n="retry" hidden>تلاش دوباره</button>
      <button type="button" id="msgClose" class="clear-btn" aria-label="close">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <!-- loading skeleton -->
    <section id="loader" hidden>
      <div class="glass card loader-card">
        <svg class="ic spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
        <p class="muted" data-i18n="loadingWeather">در حال دریافت اطلاعات…</p>
      </div>
      <div class="skeleton sk-lg"></div>
      <div class="details-grid" aria-hidden="true">
        <div class="skeleton sk-sm"></div><div class="skeleton sk-sm"></div><div class="skeleton sk-sm"></div><div class="skeleton sk-sm"></div><div class="skeleton sk-sm"></div>
      </div>
    </section>

    <!-- current weather -->
    <section id="currentCard" class="glass card current" aria-label="current" hidden></section>

    <!-- details -->
    <section id="detailsGrid" class="details-grid" aria-label="details" hidden></section>

    <!-- hourly -->
    <section id="hourlyCard" class="glass card" aria-label="hourly" hidden>
      <div class="card-head">
        <h2 class="card-title">
          <svg class="ic ic-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2h4M12 14v-4M4 13a8 8 0 1 1 16 0"/><path d="M12 22a8 8 0 0 0 8-8"/></svg>
          <span data-i18n="hourlyTitle">پیش‌بینی ساعتی</span>
        </h2>
        <span class="muted small" data-i18n="hourlyHint">۲۴ ساعت آینده</span>
      </div>
      <div id="hourlyStrip" class="hourly-strip" role="list"></div>
    </section>

    <!-- daily -->
    <section id="dailyCard" class="glass card" aria-label="daily" hidden>
      <h2 class="card-title mb">
        <svg class="ic ic-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
        <span data-i18n="dailyTitle">پیش‌بینی ۵ روزه</span>
      </h2>
      <ol id="dailyList" class="daily-list"></ol>
    </section>
  </main>

  <!-- footer -->
  <footer class="site-footer">
    <div class="wrap">
      <div class="glass footer-card">
        <p class="made-by"><span data-i18n="madeBy">ساخته شده توسط یوسف</span>
          <svg class="ic heart" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </p>
        <div class="footer-links">
          <a class="channel-btn" href="https://t.me/NeuroCodeX_1" target="_blank" rel="noopener noreferrer">
            <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
            <span data-i18n="joinChannel">کانال تلگرام ما</span>
          </a>
          <span class="muted small" data-i18n="dataBy">داده‌ها از OpenWeather</span>
        </div>
      </div>
      <p class="copyright">© <span id="year"></span> WeatherPro · آب‌وهوا پرو</p>
    </div>
  </footer>

  <!-- API key modal -->
  <div id="keyModal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <div class="glass modal-card" role="dialog" aria-modal="true" aria-labelledby="keyModalTitle">
      <h3 id="keyModalTitle" data-i18n="keyTitle">کلید API هواشناسی</h3>
      <p class="muted" data-i18n="keyDesc"></p>
      <input id="keyInput" type="text" dir="ltr" spellcheck="false" data-i18n-ph="keyPlaceholder" placeholder="OPENWEATHER API KEY" aria-label="API key" />
      <div class="modal-actions">
        <button type="button" id="keySave" class="btn btn-primary btn-pill" data-i18n="keySave">ذخیره</button>
        <button type="button" class="btn btn-outline btn-pill" data-close-modal data-i18n="keyCancel">انصراف</button>
      </div>
      <p class="muted small" data-i18n="keyHint"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
